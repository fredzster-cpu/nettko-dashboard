name: Publiser dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "map-fix.js"
      - "table-enhancements.js"
      - "status-card-filter.js"
      - "status-year-chart.js"
      - "datacenter-news.js"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Gjør dashboard robust
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            '<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">',
            '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">'
          )
          s=s.replace(
            '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>',
            '<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>'
          )
          s=s.replace('<style>', '<style>\n.leaflet-container img{max-width:none!important}.leaflet-container .leaflet-tile{max-width:none!important}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}')
          s=s.replace('initMap();initialized=true', 'initMap();setTimeout(()=>{if(map)map.invalidateSize(true)},250);initialized=true')
          if 'map-fix.js' not in s:
            s=s.replace('</body>','<script src="./map-fix.js?v=4"></script>\n</body>')
          else:
            for v in ['1','2','3']:
              s=s.replace(f'map-fix.js?v={v}','map-fix.js?v=4')
          if 'table-enhancements.js' not in s:
            s=s.replace('</body>','<script src="./table-enhancements.js?v=1"></script>\n</body>')
          if 'status-card-filter.js' not in s:
            s=s.replace('</body>','<script src="./status-card-filter.js?v=3"></script>\n</body>')
          else:
            for v in ['1','2']:
              s=s.replace(f'status-card-filter.js?v={v}','status-card-filter.js?v=3')
          if 'status-year-chart.js' not in s:
            s=s.replace('</body>','<script src="./status-year-chart.js?v=6"></script>\n</body>')
          else:
            for v in ['1','2','3','4','5']:
              s=s.replace(f'status-year-chart.js?v={v}','status-year-chart.js?v=6')
          if 'datacenter-news.js' not in s:
            s=s.replace('</body>','<script src="./datacenter-news.js?v=2"></script>\n</body>')
          else:
            s=s.replace('datacenter-news.js?v=1','datacenter-news.js?v=2')
          p.write_text(s,encoding='utf-8')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
