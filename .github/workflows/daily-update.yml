name: Oppdater Nettkø

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "scripts/fetch-statnett-v3.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-daily-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Kjør robust Statnett-henter og lagre logg
        shell: bash
        run: |
          set +e
          mkdir -p data
          node scripts/fetch-statnett-v3.mjs 2>&1 | tee data/last-run.log
          code=${PIPESTATUS[0]}
          echo "$code" > data/last-run-exit-code.txt
          exit 0

      - name: Verifiser publiseringsdata
        shell: bash
        run: |
          code=$(cat data/last-run-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Henteren feilet; publiserer ikke nytt datasett."
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const age = Date.now() - Date.parse(d.updated_at);
          const q = (d.queue || []).length;
          const r = (d.reservations || []).length;
          const q1 = d.totals?.queue?.NO1 || {};
          const q5 = d.totals?.queue?.NO5 || {};
          const r1 = d.totals?.reservations?.NO1 || {};
          const r5 = d.totals?.reservations?.NO5 || {};
          if (age > 6*60*60*1000) throw new Error('current.json er ikke fersk');
          for (const [name,x] of Object.entries({q1,q5,r1,r5})) {
            if (!(x.cases > 0 && x.mw > 0)) throw new Error(`${name} mangler saker/MW`);
          }
          console.log(`Publiseringskontroll OK: kø ${q} saker/${q1.mw+q5.mw} MW, reservasjoner ${r} saker/${r1.mw+r5.mw} MW`);
          NODE

      - name: Lagre nye data og logg
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daglig Statnett-oppdatering"
            git push
          fi

      - name: Marker feil hvis henteren feilet
        shell: bash
        run: |
          code=$(cat data/last-run-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Statnett-henter feilet med exit code $code"
            exit "$code"
          fi
