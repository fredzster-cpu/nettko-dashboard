name: Oppdater Nettkø

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "scripts/fetch-statnett.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Kjør Statnett-henter
        run: node scripts/fetch-statnett.mjs

      - name: Lagre nye data
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daglig Statnett-oppdatering"
            git push
          fi
