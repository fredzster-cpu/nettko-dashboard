name: Oppdater Nettkapasitet

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    paths:
      - "scripts/fetch-statnett-scope.mjs"
      - "scripts/merge-validated-scopes.mjs"
      - "scripts/geocode-stations.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-capacity-update
  cancel-in-progress: false

jobs:
  scope:
    name: "${{ matrix.status }} · ${{ matrix.area }}"
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        status: [queue, reservations, connected, withdrawn]
        area: [NO1, NO2, NO3, NO4, NO5]
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Hent og valider ett kontrollpunkt
        id: fetchscope
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/staging data/raw
          node scripts/fetch-statnett-scope.mjs "${{ matrix.status }}" "${{ matrix.area }}" 2>&1 | tee "data/scope-${{ matrix.status }}-${{ matrix.area }}.log"

      - name: Oppsummer kontrollpunkt
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.status }} · ${{ matrix.area }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "data/staging/${{ matrix.status }}-${{ matrix.area }}.json" ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const status=process.env.STATUS,area=process.env.AREA;
          const x=JSON.parse(fs.readFileSync(`data/staging/${status}-${area}.json`,'utf8'));
          console.log(`✅ Validert: **${x.cases} saker / ${x.row_mw} MW** mot Statnett KPI **${x.kpi_mw} MW**`);
          NODE
          else
            echo "⚠️ Ikke validert i denne kjøringen. Siste gode produksjonsdata beholdes ved sammenslåing." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          STATUS: ${{ matrix.status }}
          AREA: ${{ matrix.area }}

      - name: Last opp resultat for kontrollpunkt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-${{ matrix.status }}-${{ matrix.area }}
          path: |
            data/staging/
            data/raw/
            data/scope-${{ matrix.status }}-${{ matrix.area }}.log
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Slå sammen validerte kontrollpunkter
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Last ned alle kontrollpunkter
        uses: actions/download-artifact@v4
        with:
          pattern: scope-*
          path: .
          merge-multiple: true

      - name: Slå sammen kun validerte områder
        run: node scripts/merge-validated-scopes.mjs

      - name: Koordinatfest transmisjonsnettstasjoner
        continue-on-error: true
        run: node scripts/geocode-stations.mjs

      - name: Kontroller sammenslått produksjonsgrunnlag
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const areas=['NO1','NO2','NO3','NO4','NO5'];
          for(const k of ['queue','reservations','connected','withdrawn']){
            const rows=d[k]||[];
            const bad=rows.filter(x=>!areas.includes(x.area)||!Number.isFinite(Number(x.mw))||Number(x.mw)<=0);
            if(bad.length)throw new Error(`${k}: ${bad.length} ugyldige rader`);
            for(const a of areas){
              const ar=rows.filter(x=>x.area===a),mw=ar.reduce((s,x)=>s+Number(x.mw),0),t=d.totals?.[k]?.[a];
              if(!t||Number(t.cases)!==ar.length||Math.abs(Number(t.mw)-mw)>0.01)throw new Error(`${k} ${a}: totals samsvarer ikke med rader`);
            }
          }
          const report=JSON.parse(fs.readFileSync('data/scope-validation-report.json','utf8'));
          console.log(`Validerte kontrollpunkter: ${report.published.length}/20`);
          console.log(`Beholdt siste gode: ${report.preserved.length}/20`);
          console.log(`Uten validert historikk: ${report.missing.length}/20`);
          if(report.missing.some(x=>x.endsWith(':NO1')||x.endsWith(':NO5')))throw new Error('NO1/NO5 mangler et tidligere validert kontrollpunkt');
          NODE

      - name: Fjern midlertidige artefakter
        run: rm -rf data/staging data/scope-*.log

      - name: Publiser kun sammenslåtte og validerte data
        run: |
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-oppdatering – områdevis validering"
            git push
          fi
