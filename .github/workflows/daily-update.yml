name: Oppdater Nettkø

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "scripts/fetch-queue-prod.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-daily-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0
      - name: Hent og valider kapasitetskø
        shell: bash
        run: |
          set +e
          mkdir -p data
          node scripts/fetch-queue-prod.mjs 2>&1 | tee data/last-run.log
          code=${PIPESTATUS[0]}
          echo "$code" > data/last-run-exit-code.txt
          exit 0
      - name: Verifiser produksjonsdata
        shell: bash
        run: |
          code=$(cat data/last-run-exit-code.txt)
          if [ "$code" != "0" ]; then exit "$code"; fi
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const q=d.queue||[];
          const mw=q.reduce((s,x)=>s+(x.mw||0),0);
          const q1=d.totals?.queue?.NO1||{}, q5=d.totals?.queue?.NO5||{};
          if(q.length<60) throw new Error(`For få køsaker: ${q.length}`);
          if(mw<3000) throw new Error(`For lav samlet MW: ${mw}`);
          if(!(q1.cases>0&&q1.mw>0&&q5.cases>0&&q5.mw>0)) throw new Error('NO1/NO5 mangler');
          if(Date.now()-Date.parse(d.updated_at)>6*60*60*1000) throw new Error('current.json er ikke fersk');
          console.log(`PRODUKSJONSDATA OK: ${q.length} saker / ${mw} MW`);
          NODE
      - name: Lagre nye data og logg
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daglig Statnett-oppdatering"
            git push
          fi
      - name: Marker feil hvis henteren feilet
        shell: bash
        run: |
          code=$(cat data/last-run-exit-code.txt)
          if [ "$code" != "0" ]; then exit "$code"; fi
