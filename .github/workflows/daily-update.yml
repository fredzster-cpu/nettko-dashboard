name: Oppdater Nettkapasitet

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "scripts/fetch-capacity-prod.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-daily-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Hent Statnett-data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data
          node scripts/fetch-capacity-prod.mjs 2>&1 | tee data/last-run.log

      - name: Verifiser produksjonsgrunnlag
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const q=d.queue||[];
          const qmw=q.reduce((s,x)=>s+(x.mw||0),0);
          if(q.length<60 || qmw<3000) throw new Error(`Kødata ufullstendige: ${q.length} / ${qmw} MW`);
          if(!d.status_meta?.queue?.ok) throw new Error('Kødata er ikke markert validert');
          if(Date.now()-Date.parse(d.updated_at)>6*60*60*1000) throw new Error('current.json er ikke fersk');
          console.log(`PRODUKSJONSGRUNNLAG OK: kø ${q.length}/${qmw} MW`);
          for(const k of ['reservations','withdrawn','connected']) {
            const m=d.status_meta?.[k];
            console.log(`${k}: ${m?.ok?'VALIDERT':'ikke validert ennå'}${m?.error?' – '+m.error:''}`);
          }
          NODE

      - name: Lagre nye data og logg
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daglig Statnett-oppdatering"
            git push
          fi
