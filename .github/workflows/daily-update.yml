name: Oppdater Nettkapasitet

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    paths:
      - "scripts/fetch-capacity-prod.mjs"
      - "scripts/fetch-status-source.mjs"
      - "scripts/fetch-connected-by-area.mjs"
      - "scripts/audit-statnett-live.mjs"
      - "scripts/geocode-stations.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-capacity-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Hent Statnett-data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data
          node scripts/fetch-capacity-prod.mjs 2>&1 | tee data/last-run.log

      - name: Fallback reservasjoner via Statnett-siden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-status-source.mjs reservations 2>&1 | tee -a data/last-run.log

      - name: Fallback tilbaketrukket via Statnett-siden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-status-source.mjs withdrawn 2>&1 | tee -a data/last-run.log

      - name: Hent tilknyttet direkte fra Statnetts NO1- og NO5-filtre
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-connected-by-area.mjs 2>&1 | tee -a data/last-run.log

      - name: Koordinatfest transmisjonsnettstasjoner
        continue-on-error: true
        shell: bash
        run: |
          node scripts/geocode-stations.mjs

      - name: Verifiser komplett produksjonsgrunnlag
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const requirements={queue:{cases:60,mw:3000},reservations:{cases:1,mw:1},withdrawn:{cases:1,mw:1},connected:{cases:1,mw:1}};
          for(const [k,min] of Object.entries(requirements)) {
            const rows=d[k]||[];
            const mw=rows.reduce((s,x)=>s+(Number(x.mw)||0),0);
            const meta=d.status_meta?.[k];
            if(!meta?.ok || !meta?.fresh) throw new Error(`${k} er ikke ferskt og validert: ${meta?.error||'mangler status'}`);
            if(rows.length<min.cases || mw<min.mw) throw new Error(`${k} ufullstendig: ${rows.length} saker / ${mw} MW`);
            const badArea=rows.filter(x=>!['NO1','NO5'].includes(x.area));
            if(badArea.length) throw new Error(`${k} har ${badArea.length} rader uten gyldig NO1/NO5`);
            const badMw=rows.filter(x=>!Number.isFinite(Number(x.mw)) || Number(x.mw)<=0);
            if(badMw.length) throw new Error(`${k} har ${badMw.length} rader med ugyldig MW`);
            const keys=rows.map(x=>`${x.statnett_case||''}|${x.tilko_case||''}|${x.station||''}|${x.end_customer||''}|${x.mw||''}|${x.date||''}`);
            const duplicates=keys.filter((x,i)=>keys.indexOf(x)!==i);
            if(duplicates.length) throw new Error(`${k} har ${duplicates.length} duplikatrader`);
            const byArea={NO1:rows.filter(x=>x.area==='NO1'),NO5:rows.filter(x=>x.area==='NO5')};
            for(const a of ['NO1','NO5']){
              const calcMw=byArea[a].reduce((s,x)=>s+(Number(x.mw)||0),0);
              const calcCases=byArea[a].length;
              const t=d.totals?.[k]?.[a];
              if(!t || Math.abs((Number(t.mw)||0)-calcMw)>0.01 || Number(t.cases)!==calcCases) throw new Error(`${k} ${a} totals samsvarer ikke med radene`);
            }
            console.log(`${k.toUpperCase()} INTERNKONTROLL OK: ${rows.length} saker / ${mw} MW`);
          }
          if(Date.now()-Date.parse(d.updated_at)>8*60*60*1000) throw new Error('current.json er ikke fersk');
          console.log('KOMPLETT PRODUKSJONSGRUNNLAG INTERNKONTROLL OK');
          NODE

      - name: Kryssjekk alle KPI-tall direkte mot Statnett
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-statnett-live.mjs 2>&1 | tee -a data/last-run.log

      - name: Lagre kun data som er kryssjekket mot Statnett
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-oppdatering – live audit OK"
            git push
          fi

      - name: Bevar feildiagnostikk uten å publisere ikke-validerte data
        if: failure()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git restore --source=HEAD -- data/current.json data/history.json data/stations.json 2>/dev/null || true
          rm -f data/statnett-audit.json
          git add data/last-run.log data/raw/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-validering feilet – lagre diagnostikk"
            git push
          fi
