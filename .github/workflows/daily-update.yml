name: Oppdater Nettkapasitet

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    paths:
      - "scripts/fetch-capacity-prod.mjs"
      - "scripts/fetch-status-source.mjs"
      - "scripts/geocode-stations.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-capacity-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Hent Statnett-data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data
          node scripts/fetch-capacity-prod.mjs 2>&1 | tee data/last-run.log

      - name: Fallback reservasjoner via Statnett-siden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-status-source.mjs reservations 2>&1 | tee -a data/last-run.log

      - name: Fallback tilbaketrukket via Statnett-siden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-status-source.mjs withdrawn 2>&1 | tee -a data/last-run.log

      - name: Fallback tilknyttet via Statnett-siden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-status-source.mjs connected 2>&1 | tee -a data/last-run.log

      - name: Koordinatfest transmisjonsnettstasjoner
        continue-on-error: true
        shell: bash
        run: |
          node scripts/geocode-stations.mjs

      - name: Verifiser komplett produksjonsgrunnlag
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const requirements={queue:{cases:60,mw:3000},reservations:{cases:1,mw:1},withdrawn:{cases:1,mw:1},connected:{cases:1,mw:1}};
          for(const [k,min] of Object.entries(requirements)) {
            const rows=d[k]||[];
            const mw=rows.reduce((s,x)=>s+(x.mw||0),0);
            const meta=d.status_meta?.[k];
            if(!meta?.ok || !meta?.fresh) throw new Error(`${k} er ikke ferskt og validert: ${meta?.error||'mangler status'}`);
            if(rows.length<min.cases || mw<min.mw) throw new Error(`${k} ufullstendig: ${rows.length} saker / ${mw} MW`);
            console.log(`${k.toUpperCase()} OK: ${rows.length} saker / ${mw} MW`);
          }
          if(Date.now()-Date.parse(d.updated_at)>8*60*60*1000) throw new Error('current.json er ikke fersk');
          console.log('KOMPLETT PRODUKSJONSGRUNNLAG OK');
          NODE

      - name: Lagre nye data og logg
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-oppdatering"
            git push
          fi
