name: Oppdater Nettkapasitet

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    paths:
      - "scripts/fetch-capacity-all-areas.mjs"
      - "scripts/fetch-connected-all-areas.mjs"
      - "scripts/audit-statnett-all-areas.mjs"
      - "scripts/geocode-stations.mjs"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: statnett-capacity-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Playwright-pakken
        run: npm install playwright@1.62.0

      - name: Hent kø, reservasjoner og tilbaketrukket for NO1–NO5
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data
          node scripts/fetch-capacity-all-areas.mjs 2>&1 | tee data/last-run.log

      - name: Hent tilknyttet for NO1–NO5 med eksplisitt prisområdefilter
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-connected-all-areas.mjs 2>&1 | tee -a data/last-run.log

      - name: Koordinatfest transmisjonsnettstasjoner
        continue-on-error: true
        shell: bash
        run: |
          node scripts/geocode-stations.mjs

      - name: Verifiser komplett produksjonsgrunnlag
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/current.json','utf8'));
          const areas=['NO1','NO2','NO3','NO4','NO5'];
          const requirements={queue:{cases:100,mw:5000},reservations:{cases:30,mw:500},withdrawn:{cases:3,mw:20},connected:{cases:10,mw:100}};
          for(const [k,min] of Object.entries(requirements)) {
            const rows=d[k]||[];
            const mw=rows.reduce((s,x)=>s+(Number(x.mw)||0),0);
            const meta=d.status_meta?.[k];
            if(!meta?.ok || !meta?.fresh) throw new Error(`${k} er ikke ferskt og validert: ${meta?.error||'mangler status'}`);
            if(rows.length<min.cases || mw<min.mw) throw new Error(`${k} ufullstendig: ${rows.length} saker / ${mw} MW`);
            const badArea=rows.filter(x=>!areas.includes(x.area));
            if(badArea.length) throw new Error(`${k} har ${badArea.length} rader uten gyldig NO1–NO5`);
            const badMw=rows.filter(x=>!Number.isFinite(Number(x.mw)) || Number(x.mw)<=0);
            if(badMw.length) throw new Error(`${k} har ${badMw.length} rader med ugyldig MW`);
            const keys=rows.map(x=>`${x.statnett_case||''}|${x.tilko_case||''}|${x.station||''}|${x.end_customer||''}|${x.mw||''}|${x.date||''}|${x.area||''}`);
            const duplicates=keys.filter((x,i)=>keys.indexOf(x)!==i);
            if(duplicates.length) throw new Error(`${k} har ${duplicates.length} duplikatrader`);
            for(const a of areas){
              const ar=rows.filter(x=>x.area===a),calcMw=ar.reduce((s,x)=>s+(Number(x.mw)||0),0),calcCases=ar.length,t=d.totals?.[k]?.[a];
              if(!t || Math.abs((Number(t.mw)||0)-calcMw)>0.01 || Number(t.cases)!==calcCases) throw new Error(`${k} ${a} totals samsvarer ikke med radene`);
            }
            console.log(`${k.toUpperCase()} INTERNKONTROLL OK: ${rows.length} saker / ${mw} MW`);
          }
          if(Date.now()-Date.parse(d.updated_at)>8*60*60*1000) throw new Error('current.json er ikke fersk');
          console.log('KOMPLETT PRODUKSJONSGRUNNLAG NO1–NO5 INTERNKONTROLL OK');
          NODE

      - name: Kryssjekk alle KPI-tall for NO1–NO5 direkte mot Statnett
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-statnett-all-areas.mjs 2>&1 | tee -a data/last-run.log

      - name: Lagre kun data som er kryssjekket mot Statnett
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-oppdatering NO1–NO5 – live audit OK"
            git push
          fi

      - name: Bevar feildiagnostikk uten å publisere ikke-validerte data
        if: failure()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nettko-bot"
          git config user.email "nettko-bot@users.noreply.github.com"
          git restore --source=HEAD -- data/current.json data/history.json data/stations.json 2>/dev/null || true
          rm -f data/statnett-audit.json
          git add data/last-run.log data/raw/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Statnett-validering NO1–NO5 feilet – lagre diagnostikk"
            git push
          fi
